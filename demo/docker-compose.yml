# Local mock of the WordPress + MySQL tiers. Demo only; not part of the Terraform deployment.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: demo-only-password
      MYSQL_ROOT_PASSWORD: demo-only-root
    volumes:
      - dbdata:/var/lib/mysql
  wordpress:
    image: wordpress:latest
    depends_on: [db]
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: demo-only-password
    volumes:
      - wpdata:/var/www/html
volumes:
  dbdata:
  wpdata:
